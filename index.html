<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#F7F6F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>日记</title>
<style>
  :root{
    --bg:#F7F6F2;
    --paper:#FFFFFF;
    --ink:#1F1E1B;
    --sub:#8C8981;
    --line:#DEDBD3;
    --red:#C8452F;
    --r:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;}
  body{
    background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    font-size:14px;line-height:1.5;overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .num{font-variant-numeric:tabular-nums;}

  .app{
    max-width:560px;margin:0 auto;min-height:100vh;
    padding:calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;
  }
  @supports (height: 100dvh){ .app{min-height:100dvh;} }

  /* ---------- 左列顶部：标题 ---------- */
  .hero{
    flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    padding:0;
  }
  .title{
    width:96px;height:auto;display:block;
    mix-blend-mode:multiply;
    -webkit-user-select:none;user-select:none;
  }

  /* ---------- 主体 ---------- */
  .stage{
    flex:1 1 auto;display:flex;min-height:0;gap:10px;
  }
  .col-cal{flex:0 0 40%;display:flex;flex-direction:column;min-width:0;min-height:0;gap:10px;}
  .col-side{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;gap:9px;}

  .box{
    background:var(--paper);
    border:1.5px solid var(--line);
    border-radius:var(--r);
    padding:10px;
    position:relative;
    overflow:visible;
    margin-bottom:0;
  }

  /* ---------- 日历（2/3 宽） ---------- */
  .cal{
    flex:1;display:flex;flex-direction:column;
    min-height:0;margin-bottom:0;padding:12px;
  }
  .cal-head{
    display:flex;align-items:center;justify-content:space-between;
    font-size:12px;color:var(--sub);margin-bottom:8px;
  }
  .cal-head button{
    border:none;background:none;color:var(--sub);font-size:16px;
    padding:0 6px;cursor:pointer;font-family:inherit;line-height:1;
  }
  .cal-week,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);}
  .cal-week span{text-align:center;font-size:9px;color:#B5B2AA;line-height:1.8;}
  .cal-grid{margin-top:2px;flex:0 1 auto;}
  .cal-grid .c{
    height:20px;line-height:20px;margin:1px;
    border-radius:4px;text-align:center;
    font-size:9.5px;color:#C2BFB7;cursor:pointer;
  }
  .cal-grid .c.pad{visibility:hidden;}
  .cal-grid .c.done{background:var(--red);color:#fff;font-weight:600;}
  .cal-grid .c.today{box-shadow:inset 0 0 0 1.5px var(--ink);color:var(--ink);}
  .cal-grid .c.done.today{box-shadow:inset 0 0 0 1.5px var(--ink);color:#fff;}

  /* ---------- 侧栏 ---------- */
  .b4{flex:0 0 auto;padding:9px 10px;}
  .b4 .ymd{font-size:10.5px;letter-spacing:.01em;color:var(--sub);}
  .b4 .hm{font-size:18px;font-weight:600;letter-spacing:-.01em;line-height:1.2;}
  .b4 .wm{
    display:flex;flex-direction:column;
    font-size:10px;color:var(--sub);margin-top:2px;
    cursor:pointer;
  }
  .b4 .wm .sep{display:none;}

  .b5{flex:0 0 auto;display:flex;align-items:center;justify-content:center;padding:12px 6px;}
  .clock{
    font-size:26px;font-weight:300;letter-spacing:.01em;line-height:1.2;
    font-variant-numeric:tabular-nums;
  }
  .clock.on{color:var(--red);}

  .b6{flex:1 1 auto;display:flex;flex-direction:column;min-height:96px;padding:9px 8px;}
  .b6 .hd{
    display:flex;align-items:center;justify-content:space-between;
    font-size:10px;color:var(--sub);margin-bottom:6px;
  }
  .todos{flex:1;overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch;}
  .todos::-webkit-scrollbar{width:0;}
  .todo{
    display:flex;align-items:flex-start;
    padding:3px 0;font-size:12px;line-height:1.45;cursor:pointer;
  }
  .todo .n{color:var(--sub);font-size:9px;padding-top:2px;min-width:11px;}
  .todo .t{flex:1;word-break:break-word;padding-right:3px;}
  .todo.on .t{color:var(--sub);text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:1.5px;}
  .todo .del{
    border:none;background:none;color:#CFCCC4;font-size:13px;line-height:1;
    padding:0 1px;cursor:pointer;font-family:inherit;
  }
  .addrow{display:flex;margin-top:6px;}
  .addrow input{
    flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;
    padding:6px 7px;font-size:11.5px;font-family:inherit;color:var(--ink);background:#FCFBF9;
  }
  .addrow input:focus{outline:none;border-color:var(--ink);}
  .addrow button{
    border:1px solid var(--line);background:var(--paper);border-radius:8px;
    width:28px;margin-left:5px;font-size:15px;color:var(--ink);cursor:pointer;font-family:inherit;
  }

  .prog{margin-top:7px;}
  .prog .bar{height:5px;border-radius:3px;background:#EFEDE7;overflow:hidden;}
  .prog .fill{height:100%;width:0;background:var(--red);border-radius:3px;transition:width .4s ease;}
  .prog .meta{
    display:flex;justify-content:space-between;
    font-size:9px;color:var(--sub);margin-top:4px;
  }

  .b7{
    flex:0 0 auto;height:46px;border-radius:var(--r);width:100%;
    border:1.5px solid var(--ink);background:var(--ink);color:#fff;
    font-size:14px;font-weight:600;letter-spacing:.12em;font-family:inherit;
    cursor:pointer;
  }
  .b7.running{background:var(--paper);color:var(--red);border-color:var(--red);}

  /* ---------- toast ---------- */
  .toast{
    position:fixed;left:50%;bottom:70px;margin-left:-90px;width:180px;
    background:rgba(31,30,27,.92);color:#fff;font-size:12px;
    padding:9px 12px;border-radius:20px;opacity:0;pointer-events:none;
    transition:opacity .22s;z-index:200;text-align:center;
  }
  .toast.show{opacity:1;}

  /* ---------- 出错提示条 ---------- */
  #errbar{
    display:none;position:fixed;left:0;right:0;top:0;z-index:300;
    background:#C8452F;color:#fff;font-size:11px;line-height:1.4;
    padding:8px 12px;font-family:monospace;word-break:break-all;
  }
  #errbar.show{display:block;}

  /* 临时版本标记，确认是否读到新文件 */
  .ver{
    position:fixed;left:6px;bottom:4px;z-index:50;
    font-size:9px;color:#C9C6BE;font-family:monospace;pointer-events:none;
  }

  /* ================= 视图 ================= */
  .view{display:none;}
  .view.active{display:block;}
  #view-home{flex:1;min-height:0;display:none;}
  #view-home.active{display:flex;flex-direction:column;min-height:0;}

  .app{padding-bottom:calc(72px + env(safe-area-inset-bottom));}

  /* ================= 底部 tab ================= */
  .tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:60;
    display:flex;justify-content:center;
    background:rgba(247,246,242,.94);
    border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .tabbar button{
    flex:1;max-width:186px;height:58px;border:none;background:none;
    font-family:inherit;font-size:12px;color:var(--sub);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .tabbar button.on{color:var(--ink);font-weight:600;}

  /* ================= 记录页 ================= */
  #view-log{padding-top:calc(16px + env(safe-area-inset-top));}
  .lg-head{
    display:flex;align-items:center;justify-content:space-between;
    font-size:15px;margin-bottom:14px;
  }
  .lg-head button{
    border:none;background:none;color:var(--sub);font-size:20px;
    padding:2px 10px;cursor:pointer;font-family:inherit;line-height:1;
  }
  .lg-grid{
    display:grid;grid-template-columns:repeat(7,1fr);
    background:var(--paper);border:1.5px solid var(--line);
    border-radius:var(--r);padding:10px;margin-top:6px;
  }
  .lg-grid .lc{
    height:52px;line-height:52px;margin:2px;border-radius:9px;
    text-align:center;font-size:14px;color:#C2BFB7;cursor:pointer;
    font-variant-numeric:tabular-nums;
  }
  .lg-grid .lc.pad{visibility:hidden;}
  .lg-grid .lc.done{background:var(--red);color:#fff;font-weight:600;}
  .lg-grid .lc.today{box-shadow:inset 0 0 0 1.5px var(--ink);color:var(--ink);}
  .lg-grid .lc.done.today{box-shadow:inset 0 0 0 1.5px var(--ink);color:#fff;}

  #view-log .cal-week span{font-size:11px;line-height:2;}

  .stats{display:flex;gap:9px;margin-top:14px;}
  .stat{
    flex:1;background:var(--paper);border:1.5px solid var(--line);
    border-radius:12px;padding:12px 6px;text-align:center;
  }
  .stat b{display:block;font-size:20px;font-weight:650;line-height:1.25;}
  .stat span{font-size:10px;color:var(--sub);}
  .tip{font-size:11px;color:var(--sub);text-align:center;margin-top:14px;}

  /* ================= 我的 ================= */
  #view-me{padding-top:calc(16px + env(safe-area-inset-top));}
  .me-title{font-size:20px;font-weight:650;margin:0 0 16px;}
  .mrow{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--paper);border:1.5px solid var(--line);
    border-radius:12px;padding:14px;margin-bottom:9px;
  }
  .mrow .lb{font-size:13px;}
  .mrow .hint{font-size:10.5px;color:var(--sub);margin-top:2px;}
  .mrow input[type=number]{
    width:84px;text-align:right;border:none;background:transparent;
    font-size:16px;font-weight:600;color:var(--ink);font-family:inherit;
    font-variant-numeric:tabular-nums;
  }
  .mrow input:focus{outline:none;}
  .chips{display:flex;gap:6px;}
  .chip{
    padding:6px 12px;border-radius:16px;border:1px solid var(--line);
    background:var(--paper);font-size:12px;color:var(--sub);
    font-family:inherit;cursor:pointer;
  }
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink);}
  .danger .lb{color:#B23A3A;}

  /* ================= 日记页 ================= */
  .view.diary{
    position:fixed;inset:0;z-index:90;background:var(--bg);
    padding:calc(10px + env(safe-area-inset-top)) 16px calc(14px + env(safe-area-inset-bottom));
    max-width:560px;margin:0 auto;
  }
  .view.diary.active{display:flex;flex-direction:column;}
  .dbar{display:flex;align-items:center;gap:6px;margin-bottom:10px;}
  .dbar button{
    border:none;background:none;color:var(--sub);font-size:22px;
    padding:0 6px 0 0;cursor:pointer;font-family:inherit;line-height:1;
  }
  .dbar span{font-size:14px;font-weight:600;}
  .dmeta{
    display:flex;align-items:center;gap:6px;
    font-size:11px;color:var(--sub);margin-bottom:10px;
  }
  #d-count{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;}
  #d-todo{margin-left:auto;}
  #d-text{
    flex:1;width:100%;border:none;background:transparent;resize:none;
    font-family:inherit;font-size:15px;line-height:1.85;color:var(--ink);
    padding:0;
  }
  #d-text:focus{outline:none;}
  .checkbtn{
    margin-top:10px;height:42px;border-radius:12px;
    border:1.5px solid var(--line);background:var(--paper);
    color:var(--sub);font-size:13px;font-family:inherit;cursor:pointer;
  }
  .checkbtn.on{background:var(--red);border-color:var(--red);color:#fff;font-weight:600;}

  /* 主页日历只做展示 */
  .cal-head.solo{justify-content:center;margin-bottom:6px;}
  .cal-grid{cursor:default;}
  .cal-grid .c{cursor:default;}

  
  
  
  
  
  
  
  
  
  
  /* BASE-EXTRA-CSS */
  /* ================= 背景图层 ================= */
  .bg{
    position:fixed;inset:0;z-index:-1;
    background-size:cover;background-position:center;background-repeat:no-repeat;
    background-color:var(--bg);
  }
  .has-bg .box{
    background:rgba(255,255,255,.80);
    -webkit-backdrop-filter:blur(16px) saturate(120%);
    backdrop-filter:blur(16px) saturate(120%);
    border-color:rgba(255,255,255,.55);
  }
  .has-bg .tabbar{background:rgba(247,246,242,.82);}
  .has-bg .stat,.has-bg .mrow{background:rgba(255,255,255,.80);}

  /* ================= 视图 ================= */
  .view{display:none;}
  .view.active{display:block;}
  #view-home{display:none;}
  #view-home.active{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;}

  .app{padding-bottom:calc(72px + env(safe-area-inset-bottom));}

  /* ================= 主页排版（单列） ================= */
  .stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:9px;}

  /* 标题 + 时间框并排，一比一 */
  .homehead{flex:0 0 auto;display:flex;gap:9px;align-items:stretch;}
  .hero{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;padding:0;}
  .title{width:100%;max-width:132px;}

  /* 时间/地点/天气：按参考图排 */
  .b4{
    flex:1 1 0;min-width:0;
    padding:9px 11px 8px;
    cursor:pointer;
    display:flex;flex-direction:column;justify-content:center;
  }
  .b4 .loc{
    display:flex;align-items:center;gap:3px;
    font-size:9.5px;color:var(--sub);line-height:1.3;
  }
  .b4 .loc .pin{font-size:8px;}
  .b4 .hm{
    font-size:26px;font-weight:650;line-height:1.05;
    letter-spacing:-.02em;margin:2px 0 1px;
  }
  .b4 .b4foot{
    display:flex;align-items:baseline;justify-content:space-between;
    font-size:9.5px;color:var(--sub);line-height:1.3;
  }
  .b4 .temp{font-size:11px;color:var(--ink);font-weight:600;}

  /* 计时器：整行，字号放大 */
  .b5{flex:0 0 auto;padding:16px 8px;}
  .clock{font-size:40px;letter-spacing:.03em;}

  /* 待办：吃掉剩余高度 */
  .b6{flex:1 1 auto;min-height:170px;padding:11px 11px 10px;display:flex;flex-direction:column;}
  .b6 .hd{font-size:11.5px;margin-bottom:6px;}
  .b6 .hd-t{font-size:14px;font-weight:700;letter-spacing:.02em;}
  .todos{flex:1;min-height:0;overflow-y:auto;}
  .todo{font-size:13px;padding:3px 0;}
  .addrow input{padding:8px 9px;font-size:12.5px;}
  .addrow button{width:32px;font-size:16px;}
  .prog{margin-top:9px;}
  .prog .bar{height:9px;border-radius:5px;}
  .prog .fill{border-radius:5px;}
  .prog .meta{font-size:10px;margin-top:5px;}

  /* 开始按钮 */
  .b7{flex:0 0 auto;height:52px;font-size:16px;}

  /* ================= 底部 tab ================= */
  .tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:60;
    display:flex;justify-content:center;
    background:rgba(247,246,242,.94);
    border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .tabbar button{
    flex:1;max-width:186px;height:56px;border:none;background:none;
    font-family:inherit;font-size:12px;color:var(--sub);cursor:pointer;
  }
  .tabbar button.on{color:var(--ink);font-weight:600;}

  /* ================= 记录页 ================= */
  #view-log{padding-top:calc(16px + env(safe-area-inset-top));}
  .lg-head{
    display:flex;align-items:center;justify-content:space-between;
    font-size:15px;margin-bottom:12px;
  }
  .lg-head button{
    border:none;background:none;color:var(--sub);font-size:20px;
    padding:2px 10px;cursor:pointer;font-family:inherit;line-height:1;
  }
  #view-log .cal-week span{font-size:11px;line-height:2;}
  .lg-grid{
    display:grid;grid-template-columns:repeat(7,1fr);
    background:var(--paper);border:1.5px solid var(--line);
    border-radius:var(--r);padding:10px;margin-top:4px;
  }
  .lg-grid .lc{
    height:52px;line-height:52px;margin:2px;border-radius:9px;
    text-align:center;font-size:14px;color:#C2BFB7;cursor:pointer;
    font-variant-numeric:tabular-nums;
  }
  .lg-grid .lc.pad{visibility:hidden;}
  .lg-grid .lc.done{background:var(--red);color:#fff;font-weight:600;}
  .lg-grid .lc.today{box-shadow:inset 0 0 0 1.5px var(--ink);color:var(--ink);}
  .lg-grid .lc.done.today{box-shadow:inset 0 0 0 1.5px var(--ink);color:#fff;}

  .stats{display:flex;gap:9px;margin-top:14px;}
  .stat{
    flex:1;background:var(--paper);border:1.5px solid var(--line);
    border-radius:12px;padding:12px 6px;text-align:center;
  }
  .stat b{display:block;font-size:20px;font-weight:650;line-height:1.25;}
  .stat span{font-size:10px;color:var(--sub);}
  .tip{font-size:11px;color:var(--sub);text-align:center;margin-top:14px;}

  /* ================= 我的 ================= */
  #view-me{padding-top:calc(16px + env(safe-area-inset-top));}
  .me-title{font-size:20px;font-weight:650;margin:0 0 14px;}
  .mrow{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--paper);border:1.5px solid var(--line);
    border-radius:12px;padding:14px;margin-bottom:9px;
  }
  .mrow .lb{font-size:13px;}
  .mrow .hint{font-size:10.5px;color:var(--sub);margin-top:2px;}
  .chip{
    display:inline-block;padding:7px 13px;border-radius:16px;
    border:1px solid var(--line);background:var(--paper);
    font-size:12px;color:var(--ink);font-family:inherit;cursor:pointer;
  }
  .danger .lb{color:#B23A3A;}
  .chip.done{background:transparent;color:var(--sub);border-style:dashed;}

  .bgstrip{
    display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    padding:2px 2px 6px;margin:-2px 0 6px;
  }
  .bgstrip::-webkit-scrollbar{height:0;}
  .bgitem{
    flex:0 0 auto;
    width:62px;height:62px;border-radius:10px;
    background-size:cover;background-position:center;
    border:2px solid transparent;background-color:#EDEBE5;
    position:relative;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;color:var(--sub);
  }
  .bgitem.on{border-color:var(--red);}
  .bgitem.none{background-image:none;}
  .bgitem .bgdel{
    position:absolute;top:-6px;right:-6px;
    width:20px;height:20px;border-radius:50%;
    border:none;background:rgba(31,30,27,.72);color:#fff;
    font-size:12px;line-height:1;cursor:pointer;font-family:inherit;
    padding:0;
  }
  .bgempty{font-size:11px;color:var(--sub);padding:8px 0;}

  /* ================= 日记页 ================= */
  .view.diary{
    position:fixed;inset:0;z-index:90;background:var(--bg);
    padding:calc(10px + env(safe-area-inset-top)) 16px calc(14px + env(safe-area-inset-bottom));
    max-width:560px;margin:0 auto;
  }
  .view.diary.active{display:flex;flex-direction:column;}
  .dbar{display:flex;align-items:center;gap:6px;margin-bottom:10px;}
  .dbar button{
    border:none;background:none;color:var(--sub);font-size:22px;
    padding:0 6px 0 0;cursor:pointer;font-family:inherit;line-height:1;
  }
  .dbar span{font-size:14px;font-weight:600;}
  .dmeta{
    display:flex;align-items:center;gap:5px;
    font-size:11px;color:var(--sub);margin-bottom:10px;
  }
  #d-count{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;}
  #d-todo{margin-left:auto;}
  #d-text{
    flex:1;width:100%;border:none;background:transparent;resize:none;
    font-family:inherit;font-size:15px;line-height:1.85;color:var(--ink);padding:0;
  }
  #d-text:focus{outline:none;}
  .checkbtn{
    margin-top:10px;height:42px;border-radius:12px;
    border:1.5px solid var(--line);background:var(--paper);
    color:var(--sub);font-size:13px;font-family:inherit;cursor:pointer;
  }
  .checkbtn.on{background:var(--red);border-color:var(--red);color:#fff;font-weight:600;}

  /* 版本标记 */
  .ver{
    position:fixed;left:6px;bottom:4px;z-index:50;
    font-size:9px;color:#C9C6BE;font-family:monospace;pointer-events:none;
  }
</style>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  function showErr(msg){
    var el = document.getElementById("errbar");
    if(!el) return;
    el.textContent = "页面出错：" + msg;
    el.className = "show";
  }
  window.onerror = function(msg, src, line, col){
    showErr(msg + "@" + line + ":" + col);
    return false;
  };

  var KEY = "writer.v6";
  function $(id){ return document.getElementById(id); }

  var state = {
    todos: {},
    checks: {},
    diary: {},
    city: null,
    weather: null,
    timer: { running:false, startTs:0, accum:0 },
    bg: "",
    custom: [],
    builtin: [],
    builtinLoaded: false
  };

  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }
    catch(e){ toast("存储空间满了，删掉几张背景图"); }
  }
  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(!raw) return;
      var d = JSON.parse(raw);
      if(!d) return;
      if(d.todos) state.todos = d.todos;
      if(d.checks) state.checks = d.checks;
      if(d.diary) state.diary = d.diary;
      if(d.city) state.city = d.city;
      if(d.weather) state.weather = d.weather;
      if(typeof d.bg === "string") state.bg = d.bg;
      if(d.custom && d.custom.length) state.custom = d.custom;
      if(d.timer){
        state.timer.running = !!d.timer.running;
        state.timer.startTs = Number(d.timer.startTs) || 0;
        state.timer.accum = Number(d.timer.accum) || 0;
      }
    }catch(e){}
  }

  /* ---------------- 日期 ---------------- */
  function pad(n){ return n < 10 ? "0" + n : "" + n; }
  function keyOf(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
  function todayKey(){ return keyOf(new Date()); }
  var WEEK = ["周日","周一","周二","周三","周四","周五","周六"];
  function prettyDate(k){
    var p = k.split("-");
    var d = new Date(Number(p[0]), Number(p[1])-1, Number(p[2]));
    return Number(p[0]) + "年" + Number(p[1]) + "月" + Number(p[2]) + "日 " + WEEK[d.getDay()];
  }

  /* ---------------- 背景图 ---------------- */
  var bgDB = null;
  var bgURLs = {};

  function openIDB(cb){
    if(!window.indexedDB || !window.indexedDB.open){ cb(null); return; }
    var req;
    try{ req = window.indexedDB.open("diary-bg", 1); }
    catch(e){ cb(null); return; }
    req.onupgradeneeded = function(e){
      var d = e.target.result;
      if(!d.objectStoreNames.contains("imgs")) d.createObjectStore("imgs", { keyPath: "id" });
    };
    req.onsuccess = function(e){ bgDB = e.target.result; cb(bgDB); };
    req.onerror = function(){ cb(null); };
  }

  function idbAll(cb){
    if(!bgDB){ cb([]); return; }
    try{
      var req = bgDB.transaction("imgs", "readonly").objectStore("imgs").getAll();
      req.onsuccess = function(){ cb(req.result || []); };
      req.onerror = function(){ cb([]); };
    }catch(e){ cb([]); }
  }

  function idbPut(item, cb){
    if(!bgDB){ cb(false); return; }
    try{
      var tx = bgDB.transaction("imgs", "readwrite");
      tx.objectStore("imgs").put(item);
      tx.oncomplete = function(){ cb(true); };
      tx.onerror = function(){ cb(false); };
    }catch(e){ cb(false); }
  }

  function idbDel(id, cb){
    if(!bgDB){ cb(); return; }
    try{
      var tx = bgDB.transaction("imgs", "readwrite");
      tx.objectStore("imgs").delete(id);
      tx.oncomplete = function(){ cb(); };
      tx.onerror = function(){ cb(); };
    }catch(e){ cb(); }
  }

  function initBg(){
    openIDB(function(){
      idbAll(function(items){
        items.sort(function(a, b){ return a.id - b.id; });
        state.custom = [];
        for(var i = 0; i < items.length; i++){
          var it = items[i];
          bgURLs[it.id] = URL.createObjectURL(it.blob);
          state.custom.push({ id: it.id, name: it.name || "" });
        }
        renderBgList();
        applyBg();
      });
    });
    loadBuiltin();
  }

  function resolveBg(src){
    if(!src) return "";
    if(src.indexOf("idb:") === 0) return bgURLs[src.slice(4)] || "";
    return src;
  }

  function applyBg(){
    var bg = $("bg");
    if(!bg) return;
    var url = resolveBg(state.bg);
    if(url){
      bg.style.backgroundImage = 'url("' + url + '")';
      document.body.className = "has-bg";
    }else{
      bg.style.backgroundImage = "";
      document.body.className = "";
    }
  }

  /* 内置壁纸：优先 wallpapers/index.json，没有就按 1.jpg、2.jpg… 探测 */
  function loadBuiltin(){
    if(state.builtinLoaded) return;
    state.builtinLoaded = true;
    if(typeof fetch !== "function") return;
    fetch("wallpapers/index.json", { cache: "no-cache" })
      .then(function(r){
        if(!r.ok) throw new Error("no index");
        return r.json();
      })
      .then(function(list){
        if(list && list.length){
          var out = [];
          for(var i = 0; i < list.length; i++) out.push("wallpapers/" + list[i]);
          state.builtin = out;
          renderBgList();
        }else{
          probeBuiltin();
        }
      })
      .catch(function(){ probeBuiltin(); });
  }

  function probeBuiltin(){
    var found = [];
    var n = 1;
    function step(){
      if(n > 60){ state.builtin = found; renderBgList(); return; }
      var url = "wallpapers/" + n + ".jpg";
      var img = new Image();
      img.onload = function(){ found.push(url); n++; step(); };
      img.onerror = function(){ state.builtin = found; renderBgList(); };
      img.src = url;
    }
    step();
  }

  function renderBgList(){
    var strip = $("bg-strip");
    if(!strip) return;
    strip.innerHTML = "";

    function cell(src, label, delId){
      var el = document.createElement("div");
      var on = (src === state.bg);
      el.className = "bgitem" + (on ? " on" : "") + (src ? "" : " none");
      var vis = resolveBg(src);
      if(vis) el.style.backgroundImage = 'url("' + vis + '")';
      if(label) el.textContent = label;
      el.setAttribute("data-src", src);
      if(delId !== null && delId !== undefined){
        var rm = document.createElement("button");
        rm.className = "bgdel";
        rm.textContent = "×";
        rm.setAttribute("data-del", String(delId));
        el.appendChild(rm);
      }
      strip.appendChild(el);
    }

    cell("", "无", null);
    for(var a = 0; a < state.builtin.length; a++) cell(state.builtin[a], "", null);
    for(var b = 0; b < state.custom.length; b++) cell("idb:" + state.custom[b].id, "", state.custom[b].id);
  }

  function canvasToBlob(cv, cb){
    if(cv.toBlob){
      cv.toBlob(function(blob){ cb(blob); }, "image/jpeg", 0.85);
      return;
    }
    var dataUrl = cv.toDataURL("image/jpeg", 0.85);
    var bin = atob(dataUrl.split(",")[1]);
    var arr = new Uint8Array(bin.length);
    for(var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    cb(new Blob([arr], { type: "image/jpeg" }));
  }

  function addBgFile(file){
    if(!file) return;
    if(file.size > 20 * 1024 * 1024){ toast("图片太大，换一张小于 20MB 的"); return; }
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var max = 1600;
        var scale = Math.min(1, max / Math.max(img.width, img.height));
        var cv = document.createElement("canvas");
        cv.width = Math.round(img.width * scale);
        cv.height = Math.round(img.height * scale);
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);

        canvasToBlob(cv, function(blob){
          if(!blob){ toast("处理失败，换一张试试"); return; }
          var id = Date.now();
          idbPut({ id: id, blob: blob, name: file.name || "" }, function(ok){
            if(!ok){ toast("这个浏览器不让本机存图"); return; }
            bgURLs[id] = URL.createObjectURL(blob);
            state.custom.push({ id: id, name: file.name || "" });
            state.bg = "idb:" + id;
            applyBg(); save(); renderBgList();
            toast("已换成这张");
          });
        });
      };
      img.onerror = function(){ toast("这张图打不开"); };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  /* ---------------- 天气 ---------------- */
  var WMO = {
    0:["晴","☀️"], 1:["大部晴","🌤"], 2:["多云","⛅"], 3:["阴","☁️"],
    45:["雾","🌫"], 48:["雾凇","🌫"],
    51:["毛毛雨","🌦"], 53:["毛毛雨","🌦"], 55:["毛毛雨","🌦"],
    56:["冻雨","🌧"], 57:["冻雨","🌧"],
    61:["小雨","🌧"], 63:["中雨","🌧"], 65:["大雨","🌧"],
    66:["冻雨","🌧"], 67:["冻雨","🌧"],
    71:["小雪","❄️"], 73:["中雪","❄️"], 75:["大雪","❄️"], 77:["米雪","❄️"],
    80:["阵雨","🌦"], 81:["阵雨","🌦"], 82:["强阵雨","🌦"],
    85:["阵雪","🌨"], 86:["阵雪","🌨"],
    95:["雷阵雨","⛈"], 96:["雷阵雨","⛈"], 99:["雷阵雨","⛈"]
  };

  function renderWeather(){
    if(!$("w-city")) return;
    $("w-city").textContent = state.city ? state.city.name : "设置城市";
    var w = state.weather;
    if(!w || !state.city){ $("w-text").textContent = "—"; return; }
    var m = WMO[w.code] || ["", ""];
    $("w-text").textContent = Math.round(w.temp) + "°";
    if($("w-icon")) $("w-icon").textContent = m[1];
  }

  function fetchWeather(){
    if(!state.city || typeof fetch !== "function") return;
    var c = state.city;
    var url = "https://api.open-meteo.com/v1/forecast?latitude=" + c.lat +
              "&longitude=" + c.lon + "&current=temperature_2m,weather_code&timezone=auto";
    fetch(url).then(function(r){ return r.json(); }).then(function(j){
      if(!j || !j.current) return;
      state.weather = { ts: Date.now(), temp: j.current.temperature_2m, code: j.current.weather_code };
      save(); renderWeather();
    })["catch"](function(){});
  }

  function askCity(){
    var name = prompt("输入城市名（例如：北京、蒲江县）", state.city ? state.city.name : "");
    if(!name) return;
    name = name.replace(/^\s+|\s+$/g, "");
    if(!name) return;
    if(typeof fetch !== "function"){ toast("浏览器不支持联网查询"); return; }
    var url = "https://geocoding-api.open-meteo.com/v1/search?name=" +
              encodeURIComponent(name) + "&count=1&language=zh&format=json";
    fetch(url).then(function(r){ return r.json(); }).then(function(j){
      var r0 = j && j.results && j.results[0];
      if(!r0){ toast("没找到这个城市"); return; }
      state.city = { name: r0.name, lat: r0.latitude, lon: r0.longitude };
      state.weather = null;
      save(); renderWeather(); fetchWeather();
      toast("已设为 " + r0.name);
    })["catch"](function(){ toast("查询失败，检查网络"); });
  }

  /* ---------------- 时间 ---------------- */
  function renderTime(){
    if(!$("t-hm")) return;
    var now = new Date();
    $("t-hm").textContent = pad(now.getHours()) + ":" + pad(now.getMinutes());
    $("t-ymd").textContent = (now.getMonth()+1) + "月" + now.getDate() + "日" + WEEK[now.getDay()];
  }

  /* ---------------- 计时器 ---------------- */
  function elapsed(){
    var t = state.timer;
    return t.running ? (t.accum + (Date.now() - t.startTs)) : t.accum;
  }
  function fmtClock(ms){
    var s = Math.floor(ms / 1000);
    return pad(Math.floor(s / 3600)) + ":" + pad(Math.floor(s % 3600 / 60)) + ":" + pad(s % 60);
  }
  function renderClock(){
    if(!$("clock")) return;
    var el = $("clock");
    el.textContent = fmtClock(elapsed());
    el.className = state.timer.running ? "clock num on" : "clock num";
    var btn = $("btn-toggle");
    btn.textContent = state.timer.running ? "停 止" : "开 始";
    btn.className = state.timer.running ? "b7 running" : "b7";
  }
  function toggleTimer(){
    var t = state.timer;
    if(t.running){
      t.accum = elapsed();
      t.running = false;
      t.startTs = 0;
      toast("停止 · " + fmtClock(t.accum));
    }else{
      t.startTs = Date.now();
      t.running = true;
    }
    save(); renderClock();
  }

  /* ---------------- 待办 ---------------- */
  function todosOf(k){
    if(!state.todos[k]) state.todos[k] = [];
    return state.todos[k];
  }
  function doneCount(k){
    var l = state.todos[k] || [];
    var n = 0;
    for(var i = 0; i < l.length; i++){ if(l[i].d) n++; }
    return n;
  }

  function renderTodos(){
    if(!$("todos")) return;
    var k = todayKey();
    var list = todosOf(k);
    var box = $("todos");
    box.innerHTML = "";

    for(var i = 0; i < list.length; i++){
      var item = list[i];
      var row = document.createElement("div");
      row.className = item.d ? "todo on" : "todo";
      row.setAttribute("data-i", String(i));

      var n = document.createElement("span");
      n.className = "n"; n.textContent = (i + 1) + ".";

      var tt = document.createElement("span");
      tt.className = "t"; tt.textContent = item.t;

      var del = document.createElement("button");
      del.className = "del"; del.textContent = "×";
      del.setAttribute("data-del", String(i));

      row.appendChild(n); row.appendChild(tt); row.appendChild(del);
      box.appendChild(row);
    }

    var done = doneCount(k);
    var total = list.length;
    var pct = total ? Math.round(done / total * 100) : 0;

    $("todo-count").textContent = done + "/" + total;
    $("prog-fill").style.width = pct + "%";
    $("prog-pct").textContent = pct + "%";

    var label = "还没开始";
    if(total === 0) label = "还没有待办";
    else if(done === 0) label = "还没开始";
    else if(done < total) label = "还差 " + (total - done) + " 件";
    else label = "全部完成";
    $("prog-label").textContent = label;
  }

  function syncCheck(){
    if(doneCount(todayKey()) > 0 && !state.checks[todayKey()]){
      state.checks[todayKey()] = true;
      save();
    }
  }

  function toggleTodo(i){
    var list = todosOf(todayKey());
    if(!list[i]) return;
    list[i].d = !list[i].d;
    var all = list.length > 0;
    for(var j = 0; j < list.length; j++){ if(!list[j].d) all = false; }
    save(); syncCheck(); renderTodos(); renderCalSmall(); renderCalBig();
    if(all) toast("今天的事都做完了");
  }

  function addTodo(){
    var input = $("todo-input");
    if(!input) return;
    var v = input.value.replace(/^\s+|\s+$/g, "");
    if(!v) return;
    todosOf(todayKey()).push({ t: v, d: false });
    input.value = "";
    save(); renderTodos();
  }

  function delTodo(i){
    todosOf(todayKey()).splice(i, 1);
    save(); renderTodos(); renderCalSmall(); renderCalBig();
  }

  /* ---------------- 日历 ---------------- */
  var bigY = new Date().getFullYear(), bigM = new Date().getMonth();

  function buildGrid(grid, y, m, cellClass, interactive){
    if(!grid) return;
    var tkey = todayKey();
    var offset = (new Date(y, m, 1).getDay() + 6) % 7;
    var days = new Date(y, m + 1, 0).getDate();
    grid.innerHTML = "";

    for(var i = 0; i < offset; i++){
      var p = document.createElement("div");
      p.className = cellClass + " pad";
      grid.appendChild(p);
    }
    for(var d = 1; d <= days; d++){
      var k = y + "-" + pad(m + 1) + "-" + pad(d);
      var c = document.createElement("div");
      var cls = cellClass;
      if(state.checks[k]) cls += " done";
      if(k === tkey) cls += " today";
      c.className = cls;
      c.textContent = d;
      if(interactive) c.setAttribute("data-k", k);
      grid.appendChild(c);
    }
  }

  function renderCalSmall(){
    if(!$("cal-grid")) return;
    var now = new Date();
    $("cal-label").textContent = (now.getMonth() + 1) + "月";
    buildGrid($("cal-grid"), now.getFullYear(), now.getMonth(), "c", false);
  }

  function renderCalBig(){
    if(!$("lg-grid")) return;
    $("lg-label").textContent = bigY + "年" + (bigM + 1) + "月";
    buildGrid($("lg-grid"), bigY, bigM, "lc", true);
    if($("s-streak")) $("s-streak").textContent = streak();
    if($("s-best")) $("s-best").textContent = best();
  }

  function streak(){
    var cur = new Date();
    if(!state.checks[keyOf(cur)]) cur = new Date(cur.getTime() - 86400000);
    var n = 0;
    while(state.checks[keyOf(cur)]){ n++; cur = new Date(cur.getTime() - 86400000); }
    return n;
  }
  function best(){
    var keys = Object.keys(state.checks).filter(function(k){ return state.checks[k]; }).sort();
    var b = 0, run = 0, prev = null;
    for(var i = 0; i < keys.length; i++){
      if(prev){
        var p = new Date(prev + "T00:00:00");
        var expect = keyOf(new Date(p.getTime() + 86400000));
        run = (keys[i] === expect) ? run + 1 : 1;
      }else{
        run = 1;
      }
      if(run > b) b = run;
      prev = keys[i];
    }
    return b;
  }

  /* ---------------- 视图 ---------------- */
  function showView(name){
    var vs = document.querySelectorAll(".view");
    for(var i = 0; i < vs.length; i++){ vs[i].className = "view"; }
    var v = $("view-" + name);
    if(v) v.className = "view active";

    var bs = document.querySelectorAll(".tabbar button");
    for(var j = 0; j < bs.length; j++){
      bs[j].className = bs[j].getAttribute("data-tab") === name ? "on" : "";
    }
    if(name === "log"){ renderCalBig(); }
    if(name === "me"){ renderBgList(); }
    window.scrollTo(0, 0);
  }

  /* ---------------- 日记页 ---------------- */
  var openKey = null;
  var saveTimer = null;

  function diaryText(k){
    var rec = state.diary[k];
    return rec && typeof rec.text === "string" ? rec.text : "";
  }
  function countChars(s){ return s.replace(/\s/g, "").length; }

  function openDiary(k){
    openKey = k;
    if(!$("view-diary")) return;
    $("d-date").textContent = prettyDate(k);
    $("d-text").value = diaryText(k);
    $("d-count").textContent = countChars(diaryText(k));

    var done = doneCount(k);
    var total = (state.todos[k] || []).length;
    $("d-todo").textContent = total ? ("当天待办 " + done + "/" + total) : "当天没有待办";

    renderDiaryCheck();
    $("view-diary").className = "view active diary";
    if($("tabbar")) $("tabbar").style.display = "none";
  }

  function renderDiaryCheck(){
    var el = $("d-check");
    if(!el || !openKey) return;
    el.textContent = state.checks[openKey] ? "这天已打卡" : "这天未打卡";
    el.className = state.checks[openKey] ? "checkbtn on" : "checkbtn";
  }

  function closeDiary(){
    if(saveTimer){ clearTimeout(saveTimer); saveTimer = null; flushDiary(); }
    $("view-diary").className = "view";
    if($("tabbar")) $("tabbar").style.display = "";
    renderCalBig(); renderCalSmall();
  }

  function flushDiary(){
    if(!openKey) return;
    var v = $("d-text") ? $("d-text").value : "";
    if(!state.diary[openKey]) state.diary[openKey] = { text: "" };
    state.diary[openKey].text = v;
    save();
  }

  /* ---------------- toast ---------------- */
  var toastTimer = null;
  function toast(msg){
    var el = $("toast");
    if(!el) return;
    el.textContent = msg;
    el.className = "toast show";
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.className = "toast"; }, 2000);
  }

  /* ================= 首次渲染 ================= */
  load();
  initBg();
  try{ renderTime(); }catch(e){ showErr("renderTime:" + e.message); }
  try{ renderWeather(); }catch(e){ showErr("renderWeather:" + e.message); }
  try{ renderClock(); }catch(e){ showErr("renderClock:" + e.message); }
  try{ renderTodos(); }catch(e){ showErr("renderTodos:" + e.message); }
  try{ syncCheck(); }catch(e){ showErr("syncCheck:" + e.message); }
  try{ renderCalSmall(); }catch(e){ showErr("renderCalSmall:" + e.message); }
  try{ renderCalBig(); }catch(e){ showErr("renderCalBig:" + e.message); }
  try{ renderBgList(); }catch(e){ showErr("renderBgList:" + e.message); }

  if(state.city && (!state.weather || (Date.now() - state.weather.ts) > 1800000)){
    fetchWeather();
  }
  setInterval(function(){
    try{ renderTime(); renderClock(); }catch(e){}
  }, 1000);

  /* ================= 事件 ================= */
  function on(id, type, fn){
    try{
      var el = document.getElementById(id);
      if(el) el.addEventListener(type, fn, false);
    }catch(e){ showErr("bind " + id + ":" + e.message); }
  }

  on("tabbar", "click", function(e){
    var node = e.target;
    while(node && node !== this){
      var t = node.getAttribute && node.getAttribute("data-tab");
      if(t){ showView(t); return; }
      node = node.parentNode;
    }
  });

  on("t-weather", "click", askCity);
  on("btn-toggle", "click", toggleTimer);
  on("todo-add", "click", addTodo);

  on("todo-input", "keydown", function(e){
    var key = e.key || e.keyCode;
    if(key === "Enter" || key === 13){ addTodo(); }
  });

  on("todos", "click", function(e){
    var node = e.target;
    while(node && node !== this){
      if(node.getAttribute){
        var del = node.getAttribute("data-del");
        if(del !== null && del !== undefined){ delTodo(Number(del)); return; }
        var idx = node.getAttribute("data-i");
        if(idx !== null && idx !== undefined){ toggleTodo(Number(idx)); return; }
      }
      node = node.parentNode;
    }
  });

  on("lg-grid", "click", function(e){
    var node = e.target;
    while(node && node !== this){
      var k = node.getAttribute && node.getAttribute("data-k");
      if(k){ openDiary(k); return; }
      node = node.parentNode;
    }
  });

  on("lg-prev", "click", function(){
    bigM--; if(bigM < 0){ bigM = 11; bigY--; } renderCalBig();
  });
  on("lg-next", "click", function(){
    bigM++; if(bigM > 11){ bigM = 0; bigY++; } renderCalBig();
  });

  on("d-back", "click", closeDiary);
  on("d-check", "click", function(){
    if(!openKey) return;
    state.checks[openKey] = !state.checks[openKey];
    save(); renderDiaryCheck(); renderCalBig(); renderCalSmall();
  });
  on("d-text", "input", function(){
    $("d-count").textContent = countChars(this.value);
    if(saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){ flushDiary(); }, 500);
  });

  /* 背景图 */
  on("bg-file", "change", function(){
    if(this.files && this.files[0]) addBgFile(this.files[0]);
    this.value = "";
  });
  on("bg-strip", "click", function(e){
    var node = e.target;
    while(node && node !== this){
      if(node.getAttribute){
        var del = node.getAttribute("data-del");
        if(del){
          var id = Number(del);
          idbDel(id, function(){});
          if(bgURLs[id]){ URL.revokeObjectURL(bgURLs[id]); delete bgURLs[id]; }
          for(var i = state.custom.length - 1; i >= 0; i--){
            if(state.custom[i].id === id) state.custom.splice(i, 1);
          }
          if(state.bg === "idb:" + id) state.bg = "";
          applyBg(); save(); renderBgList();
          return;
        }
        var src = node.getAttribute("data-src");
        if(src !== null && src !== undefined){
          state.bg = src;
          applyBg(); save(); renderBgList();
          return;
        }
      }
      node = node.parentNode;
    }
  });

  on("btn-export", "click", function(){
    var text = JSON.stringify(state, null, 2);
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ toast("已复制"); },
        function(){ toast("复制失败"); });
    }else{
      toast("该浏览器不支持复制");
    }
  });

  on("btn-clear", "click", function(){
    if(!confirm("清空全部记录？不可恢复。")) return;
    state.todos = {}; state.checks = {}; state.diary = {};
    save();
    renderTodos(); renderCalSmall(); renderCalBig();
    toast("已清空");
  });

  /* ---------------- 安装到桌面 ---------------- */
  var installEvent = null;

  function isStandalone(){
    try{
      if(window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) return true;
    }catch(e){}
    return !!(window.navigator && window.navigator.standalone === true);
  }

  function updateInstallRow(){
    var b = $("btn-install");
    if(!b) return;
    if(isStandalone()){
      b.textContent = "已安装";
      b.className = "chip done";
    }else if(installEvent){
      b.textContent = "安装到桌面";
      b.className = "chip";
    }else{
      b.textContent = "手动安装";
      b.className = "chip";
    }
  }

  if(window.addEventListener){
    window.addEventListener("beforeinstallprompt", function(e){
      if(e && e.preventDefault) e.preventDefault();
      installEvent = e;
      updateInstallRow();
    });
    window.addEventListener("appinstalled", function(){
      installEvent = null;
      updateInstallRow();
      toast("已安装到桌面");
    });
  }

  on("btn-install", "click", function(){
    if(!installEvent){
      toast("请在 Chrome 菜单 ⋮ 里点「安装应用」");
      return;
    }
    try{ installEvent.prompt(); }catch(e){}
    if(installEvent.userChoice && installEvent.userChoice.then){
      installEvent.userChoice.then(function(){ installEvent = null; updateInstallRow(); });
    }else{
      installEvent = null; updateInstallRow();
    }
  });

  try{ updateInstallRow(); }catch(e){}

})();

</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
</body>
